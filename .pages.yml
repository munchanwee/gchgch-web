# Pages CMS 관리자 설정 — app.pagescms.org 에서 이 저장소를 열면 아래 화면이 생긴다.
# 저장하면 main 에 커밋되고, GitHub Actions 가 tools/build.py 로 정적 페이지(/work/<slug>/)를 다시 만들어 배포한다.
# 아래에 없는 필드는 저장할 때 지워질 수 있으니, works.json 에 필드를 더하면 여기에도 적는다.
media:
  input: images/works
  output: images/works
  rename: safe
  categories: [image]

content:
  - name: works
    label: 포트폴리오
    type: file
    path: data/works.json
    format: json
    list: true
    fields:
      - { name: title, label: 프로젝트명, type: string, required: true }
      - { name: slug, label: "주소용 영문 ID (예: brand-x, 주소는 /work/brand-x/)", type: string, required: true }
      - name: category
        label: 카테고리
        type: select
        options:
          values:
            - { name: brand, label: Brand }
            - { name: graphic, label: Graphic }
            - { name: digital, label: Digital }
            - { name: space, label: Space }
      - { name: type, label: "작업 범위 (예: BI · Package)", type: string }
      - { name: client, label: 클라이언트, type: string }
      - { name: location, label: "지역 (예: 전남 순천시)", type: string }
      - { name: date, label: 날짜, type: date }
      - { name: cover, label: 대표 이미지, type: image }
      - { name: summary, label: 한 줄 요약, type: text }
      - { name: body, label: "본문 (블록 페이지에서는 '개요'로 보인다)", type: rich-text }
      - { name: published, label: 공개, type: boolean, default: true }
      - name: gallery
        label: 갤러리 이미지 (블록이 없는 페이지)
        type: image
        options:
          multiple: { max: 30 }
      - name: gallery_wide
        label: 갤러리 중 전체 폭 이미지
        type: image
        options:
          multiple: { max: 30 }
      - name: blocks
        label: 페이지 블록 (위에서부터 차례로 보인다)
        type: object
        list: true
        fields:
          - name: t
            label: 블록 종류
            type: select
            options:
              values:
                - { name: img, label: 이미지 }
                - { name: text, label: 글 }
                - { name: side, label: 이미지와 글 나란히 }
                - { name: pair, label: 이미지 두 장 }
                - { name: quote, label: 인용 }
          - { name: src, label: "이미지 (이미지, 나란히)", type: image }
          - name: size
            label: "이미지 크기 (이미지 블록)"
            type: select
            options:
              values:
                - { name: full, label: 화면 전체 폭 }
                - { name: wide, label: 본문 폭 }
                - { name: mid, label: 중간 }
                - { name: small, label: 작게 }
          - name: align
            label: "작은 이미지 위치"
            type: select
            options:
              values:
                - { name: l, label: 왼쪽 }
                - { name: r, label: 오른쪽 }
          - { name: alt, label: "이미지 설명(alt), 비우면 자동", type: string }
          - { name: a, label: "왼쪽 이미지 (두 장)", type: image }
          - { name: b, label: "오른쪽 이미지 (두 장)", type: image }
          - { name: alt_a, label: "왼쪽 이미지 설명(alt)", type: string }
          - { name: alt_b, label: "오른쪽 이미지 설명(alt)", type: string }
          - { name: ratio, label: "두 장 비율 (예: 3fr 2fr)", type: string }
          - { name: h, label: "글 제목 (글, 나란히)", type: string }
          - { name: li, label: "글 항목 (글, 나란히)", type: string, list: true }
          - { name: p, label: "글 문단 (글, 인용)", type: text }
      - { name: note, label: 페이지 끝 작은 글, type: text }
